name: dc-twin

x-python-env: &python-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin}@postgres:5432/${POSTGRES_DB:-twin}
  MQTT_HOST: mosquitto
  TOPO_SITES: ${TOPO_SITES:-1}
  TOPO_HALLS: ${TOPO_HALLS:-2}
  TOPO_RACKS_PER_HALL: ${TOPO_RACKS_PER_HALL:-6}
  TOPO_SERVERS_PER_RACK: ${TOPO_SERVERS_PER_RACK:-4}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin}
      POSTGRES_DB: ${POSTGRES_DB:-twin}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./ingest/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 -i healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
    command: ["--rate", "${SIM_RATE:-0}", "--faults", "${SIM_FAULTS:-4}", "--racks", "${TOPO_RACKS_PER_HALL:-6}", "--halls", "${TOPO_HALLS:-2}"]
    environment: *python-env
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    environment:
      <<: *python-env
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-2000}
      INGEST_FLUSH_SECONDS: ${INGEST_FLUSH_SECONDS:-1.0}
      INGEST_MODE: ${INGEST_MODE:-copy}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  node-red:
    profiles: ["nodered"]
    build:
      context: ingest/node-red
    environment:
      MQTT_HOST: mosquitto
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-twin}
      PGUSER: ${POSTGRES_USER:-twin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-twin}
    ports:
      - "1880:1880"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: docker/inference.Dockerfile
    environment:
      <<: *python-env
      CHECKPOINT_DIR: /models
      INFERENCE_INTERVAL_S: ${INFERENCE_INTERVAL_S:-30}
    volumes:
      - ./checkpoints:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *python-env
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
