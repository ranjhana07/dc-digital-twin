<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DC Twin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M6 22l6-8 5 5 9-11' stroke='%232dd4bf' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <div class="brand"><span class="brand-mark"></span><span class="brand-name">DC Twin</span></div>
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#telemetry" data-view="telemetry">Telemetry</a>
      <a href="#forecasts" data-view="forecasts">Forecasts</a>
      <a href="#alerts" data-view="alerts">Alerts</a>
      <a href="#topology" data-view="topology">Topology</a>
      <div class="rail-foot">
        <span id="api-state" class="dot dot-idle"></span>
        <span id="api-label">connecting</span>
      </div>
    </nav>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">Overview</h1>
          <p id="view-subtitle" class="muted">Fleet health across all halls</p>
        </div>
        <div class="topbar-right">
          <span id="live-pill" class="pill pill-idle">stream offline</span>
          <time id="clock" class="mono muted"></time>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
