[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-digital-twin"
version = "0.1.0"
description = "Telemetry ingestion, GRU forecasting and root cause analysis for data center infrastructure"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
simulator = ["paho-mqtt>=2.0"]
ingest = ["paho-mqtt>=2.0", "psycopg2-binary>=2.9"]
ml = ["pandas>=2.1", "torch>=2.2", "psycopg2-binary>=2.9", "sqlalchemy>=2.0", "onnx>=1.16"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]
dev = ["pytest>=8.0", "httpx>=0.27", "paho-mqtt>=2.0", "psycopg2-binary>=2.9", "fastapi>=0.110", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "pandas>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
